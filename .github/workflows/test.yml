name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # SwiftPM 빌드 산출물을 캐시해 두 번째 실행부터 빨라지게 한다.
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('Sources/**/*.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-
            spm-${{ runner.os }}-

      - name: Build
        run: swift build

      # WebEditor(WKWebView) 테스트 포함 전체 스위트. 테스트는 임시 폴더/격리 DB만 쓰고 실제 메모를 건드리지 않는다.
      - name: Test
        run: swift test

      # 커밋된 JS 번들(Sources/.../WebEditor/dist)이 WebEditor/src 와 어긋나 있지 않은지 확인한다.
      - name: WebEditor bundle is up to date
        run: |
          cd WebEditor
          npm ci
          npm run build
          cd ..
          git diff --exit-code -- Sources/NotepadX/Resources/WebEditor/dist || {
            echo "::error::WebEditor/src 를 바꿨다면 'cd WebEditor && npm run build' 로 dist를 다시 만들어 커밋하세요."; exit 1; }
